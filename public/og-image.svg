<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a0b"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>
    <linearGradient id="accent-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle top-left glow -->
  <ellipse cx="200" cy="180" rx="380" ry="280" fill="url(#accent-glow)"/>

  <!-- Border frame -->
  <rect x="40" y="40" width="1120" height="550" rx="16" fill="none" stroke="#27272a" stroke-width="1.5"/>

  <!-- Accent dot -->
  <circle cx="120" cy="120" r="6" fill="#fb923c"/>

  <!-- Name -->
  <text x="120" y="290" font-family="Georgia, serif" font-size="80" font-weight="700" fill="#f5f5f4" letter-spacing="-2">Lagnajit Moharana</text>

  <!-- Divider line -->
  <rect x="120" y="316" width="960" height="1.5" fill="#27272a"/>

  <!-- Tagline -->
  <text x="120" y="370" font-family="-apple-system, sans-serif" font-size="28" font-weight="400" fill="#a8a29e">Full-Stack Developer · Cloud &amp; DevOps · AI &amp; Machine Learning</text>

  <!-- Role pill -->
  <rect x="120" y="410" width="340" height="44" rx="22" fill="#1c1c1e" stroke="#3f3f46" stroke-width="1"/>
  <text x="290" y="438" font-family="-apple-system, sans-serif" font-size="18" fill="#a8a29e" text-anchor="middle">App Dev Analyst @ Accenture</text>

  <!-- URL -->
  <text x="1080" y="565" font-family="-apple-system, sans-serif" font-size="18" fill="#52525b" text-anchor="end">lagnajitmoharana08.web.app</text>
</svg>
