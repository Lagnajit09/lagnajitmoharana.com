<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 524" width="1000" height="524" font-family="'JetBrains Mono', ui-monospace, monospace" role="img" aria-label="The public docs assistant and its RAG pipeline — offline ingestion and the live query path">
  <rect x="1" y="1" width="998" height="522" rx="10" fill="#ffffff" stroke="#141313" stroke-width="2"/>

  <text x="28" y="40" font-size="15" font-weight="700" fill="#141313">The public docs assistant — retrieval, not recall</text>
  <line x1="28" y1="52" x2="972" y2="52" stroke="#d6d0cc" stroke-width="1.5"/>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#141313"/>
    </marker>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#c84216"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8a837f"/>
    </marker>
  </defs>

  <!-- ============ INGESTION ============ -->
  <text x="28" y="78" font-size="11" font-weight="700" fill="#141313">INGESTION — offline, run when the docs change</text>
  <text x="972" y="78" font-size="10" text-anchor="end" fill="#4a4644">manage.py ingest_docs</text>

  <rect x="28" y="90" width="219" height="76" rx="6" fill="#fcf9f8" stroke="#141313" stroke-width="2"/>
  <text x="137" y="116" font-size="12.5" font-weight="700" text-anchor="middle" fill="#141313">Docs markdown</text>
  <text x="137" y="138" font-size="10" text-anchor="middle" fill="#4a4644">docs/ and tutorials/</text>
  <text x="137" y="157" font-size="10" text-anchor="middle" fill="#4a4644">frontmatter, MDX stripped</text>

  <rect x="269" y="90" width="219" height="76" rx="6" fill="#fcf9f8" stroke="#141313" stroke-width="2"/>
  <text x="378" y="116" font-size="12.5" font-weight="700" text-anchor="middle" fill="#141313">Chunk</text>
  <text x="378" y="138" font-size="10" text-anchor="middle" fill="#4a4644">split by heading</text>
  <text x="378" y="157" font-size="10" text-anchor="middle" fill="#4a4644">with a size cap</text>

  <rect x="510" y="90" width="219" height="76" rx="6" fill="#fff3ee" stroke="#c84216" stroke-width="2"/>
  <text x="619" y="116" font-size="12.5" font-weight="700" text-anchor="middle" fill="#c84216">Embed</text>
  <text x="619" y="138" font-size="10" text-anchor="middle" fill="#4a4644">bge-base-en-v1.5</text>
  <text x="619" y="157" font-size="10" text-anchor="middle" fill="#4a4644">runs locally · 768-dim</text>

  <rect x="751" y="90" width="219" height="76" rx="6" fill="#fcf9f8" stroke="#141313" stroke-width="2"/>
  <text x="860" y="116" font-size="12.5" font-weight="700" text-anchor="middle" fill="#141313">DocChunk</text>
  <text x="860" y="138" font-size="10" text-anchor="middle" fill="#4a4644">Supabase pgvector</text>
  <text x="860" y="157" font-size="10" text-anchor="middle" fill="#4a4644">upsert by content hash</text>

  <line x1="247" y1="128" x2="265" y2="128" stroke="#141313" stroke-width="2" marker-end="url(#a)"/>
  <line x1="488" y1="128" x2="506" y2="128" stroke="#141313" stroke-width="2" marker-end="url(#a)"/>
  <line x1="729" y1="128" x2="747" y2="128" stroke="#141313" stroke-width="2" marker-end="url(#a)"/>

  <!-- corpus handoff into the query path -->
  <polyline points="860,166 860,190 739,190 739,212" fill="none" stroke="#8a837f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ag)"/>
  <text x="800" y="184" font-size="9" text-anchor="middle" fill="#8a837f">queried at run time</text>

  <!-- ============ QUERY ============ -->
  <text x="28" y="204" font-size="11" font-weight="700" fill="#141313">QUERY TIME — public, no sign-in</text>
  <text x="972" y="204" font-size="10" text-anchor="end" fill="#4a4644">POST /api/ai/docs/chat/stream/</text>

  <rect x="28" y="216" width="142" height="92" rx="6" fill="#fcf9f8" stroke="#141313" stroke-width="2"/>
  <text x="99" y="244" font-size="11.5" font-weight="700" text-anchor="middle" fill="#141313">Docs visitor</text>
  <text x="99" y="268" font-size="10" text-anchor="middle" fill="#4a4644">Ask Autobot panel</text>
  <text x="99" y="288" font-size="10" text-anchor="middle" fill="#4a4644">no sign-in needed</text>

  <rect x="188" y="216" width="142" height="92" rx="6" fill="#fcf9f8" stroke="#141313" stroke-width="2"/>
  <text x="259" y="244" font-size="11.5" font-weight="700" text-anchor="middle" fill="#141313">nginx</text>
  <text x="259" y="268" font-size="10" text-anchor="middle" fill="#4a4644">routes /api/ai/*</text>
  <text x="259" y="288" font-size="10" text-anchor="middle" fill="#4a4644">TLS terminated</text>

  <rect x="348" y="216" width="142" height="92" rx="6" fill="#fff3ee" stroke="#c84216" stroke-width="2"/>
  <text x="419" y="244" font-size="11.5" font-weight="700" text-anchor="middle" fill="#c84216">Autobot</text>
  <text x="419" y="268" font-size="10" text-anchor="middle" fill="#4a4644">docs chat stream</text>
  <text x="419" y="288" font-size="10" text-anchor="middle" fill="#4a4644">IP-throttled</text>

  <rect x="508" y="216" width="142" height="92" rx="6" fill="#fcf9f8" stroke="#141313" stroke-width="2"/>
  <text x="579" y="244" font-size="11.5" font-weight="700" text-anchor="middle" fill="#141313">search_docs</text>
  <text x="579" y="268" font-size="10" text-anchor="middle" fill="#4a4644">the only tool here</text>
  <text x="579" y="288" font-size="10" text-anchor="middle" fill="#4a4644">no JWT is sent</text>

  <rect x="668" y="216" width="142" height="92" rx="6" fill="#fcf9f8" stroke="#141313" stroke-width="2"/>
  <text x="739" y="244" font-size="11.5" font-weight="700" text-anchor="middle" fill="#141313">Django</text>
  <text x="739" y="268" font-size="10" text-anchor="middle" fill="#4a4644">embeds the question</text>
  <text x="739" y="288" font-size="10" text-anchor="middle" fill="#4a4644">pgvector top-k</text>

  <rect x="828" y="216" width="142" height="92" rx="6" fill="#fcf9f8" stroke="#141313" stroke-width="2"/>
  <text x="899" y="244" font-size="11.5" font-weight="700" text-anchor="middle" fill="#141313">Answer</text>
  <text x="899" y="268" font-size="10" text-anchor="middle" fill="#4a4644">streamed back</text>
  <text x="899" y="288" font-size="10" text-anchor="middle" fill="#4a4644">with source links</text>

  <line x1="170" y1="262" x2="184" y2="262" stroke="#141313" stroke-width="2" marker-end="url(#a)"/>
  <line x1="330" y1="262" x2="344" y2="262" stroke="#141313" stroke-width="2" marker-end="url(#a)"/>
  <line x1="490" y1="262" x2="504" y2="262" stroke="#141313" stroke-width="2" marker-end="url(#a)"/>
  <line x1="650" y1="262" x2="664" y2="262" stroke="#c84216" stroke-width="2" marker-end="url(#ao)"/>
  <line x1="810" y1="262" x2="824" y2="262" stroke="#141313" stroke-width="2" marker-end="url(#a)"/>

  <text x="657" y="330" font-size="10" font-weight="700" text-anchor="middle" fill="#c84216">X-Internal-Secret · never a JWT</text>

  <!-- ============ GUARDRAILS ============ -->
  <rect x="28" y="352" width="944" height="104" rx="6" fill="#ede9e6" stroke="#141313" stroke-width="1.5"/>
  <text x="500" y="376" font-size="11" font-weight="700" text-anchor="middle" fill="#141313">The only unauthenticated surface — so it is bounded on every axis</text>
  <text x="500" y="399" font-size="10.5" text-anchor="middle" fill="#4a4644">One tool is advertised and dispatched: search_docs. Shared model pool only, never your key.</text>
  <text x="500" y="419" font-size="10.5" text-anchor="middle" fill="#4a4644">Anonymous history lives in Redis under a client-supplied id — clamped, and never a database row.</text>
  <text x="500" y="439" font-size="10.5" text-anchor="middle" fill="#4a4644">Retrieved passages are treated as data, not instructions. Every answer cites its source URLs.</text>

  <text x="28" y="482" font-size="10" fill="#4a4644">Protected routes never read the internal secret, and this route ignores bearer tokens — the two gates are disjoint.</text>
  <text x="28" y="500" font-size="10" fill="#4a4644">Embedding locally means no API key to rotate, no rate limit, and no third party ever sees what visitors ask.</text>
</svg>
