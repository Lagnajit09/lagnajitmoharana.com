<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 410" width="820" height="410" font-family="'JetBrains Mono', ui-monospace, monospace" role="img" aria-label="What's in the AutoSage product — the six main surfaces">
  <rect x="1" y="1" width="818" height="408" rx="10" fill="#ffffff" stroke="#141313" stroke-width="2"/>

  <text x="28" y="40" font-size="15" font-weight="700" fill="#141313">AutoSage — what’s in the product</text>
  <line x1="28" y1="52" x2="792" y2="52" stroke="#d6d0cc" stroke-width="1.5"/>

  <!-- Row 1 -->
  <rect x="40" y="76" width="236" height="140" rx="6" fill="#fcf9f8" stroke="#141313" stroke-width="2"/>
  <text x="158" y="104" font-size="12.5" font-weight="700" text-anchor="middle" fill="#141313">Workflow Builder</text>
  <text x="158" y="132" font-size="10.5" text-anchor="middle" fill="#4a4644">drag-and-drop DAG canvas</text>
  <text x="158" y="154" font-size="10.5" text-anchor="middle" fill="#4a4644">trigger · action · decision</text>
  <text x="158" y="176" font-size="10.5" text-anchor="middle" fill="#4a4644">one node, one server</text>
  <text x="158" y="198" font-size="10.5" text-anchor="middle" fill="#4a4644">import / export as JSON</text>

  <rect x="292" y="76" width="236" height="140" rx="6" fill="#fcf9f8" stroke="#141313" stroke-width="2"/>
  <text x="410" y="104" font-size="12.5" font-weight="700" text-anchor="middle" fill="#141313">Script Editor</text>
  <text x="410" y="132" font-size="10.5" text-anchor="middle" fill="#4a4644">Monaco, in the browser</text>
  <text x="410" y="154" font-size="10.5" text-anchor="middle" fill="#4a4644">Python · PowerShell · Shell</text>
  <text x="410" y="176" font-size="10.5" text-anchor="middle" fill="#4a4644">run one-off on a server</text>
  <text x="410" y="198" font-size="10.5" text-anchor="middle" fill="#4a4644">reusable across nodes</text>

  <rect x="544" y="76" width="236" height="140" rx="6" fill="#fcf9f8" stroke="#141313" stroke-width="2"/>
  <text x="662" y="104" font-size="12.5" font-weight="700" text-anchor="middle" fill="#141313">Key Vault</text>
  <text x="662" y="132" font-size="10.5" text-anchor="middle" fill="#4a4644">servers + credentials</text>
  <text x="662" y="154" font-size="10.5" text-anchor="middle" fill="#4a4644">encrypted at rest</text>
  <text x="662" y="176" font-size="10.5" text-anchor="middle" fill="#4a4644">never sent to the UI</text>
  <text x="662" y="198" font-size="10.5" text-anchor="middle" fill="#4a4644">saved once, reused</text>

  <!-- Row 2 -->
  <rect x="40" y="232" width="236" height="140" rx="6" fill="#fcf9f8" stroke="#141313" stroke-width="2"/>
  <text x="158" y="260" font-size="12.5" font-weight="700" text-anchor="middle" fill="#141313">Library</text>
  <text x="158" y="288" font-size="10.5" text-anchor="middle" fill="#4a4644">curated building blocks</text>
  <text x="158" y="310" font-size="10.5" text-anchor="middle" fill="#4a4644">fork a whole workflow</text>
  <text x="158" y="332" font-size="10.5" text-anchor="middle" fill="#4a4644">or a node, or a script</text>
  <text x="158" y="354" font-size="10.5" text-anchor="middle" fill="#4a4644">bindings stripped on fork</text>

  <rect x="292" y="232" width="236" height="140" rx="6" fill="#fcf9f8" stroke="#141313" stroke-width="2"/>
  <text x="410" y="260" font-size="12.5" font-weight="700" text-anchor="middle" fill="#141313">Execution Logs</text>
  <text x="410" y="288" font-size="10.5" text-anchor="middle" fill="#4a4644">every run, one list</text>
  <text x="410" y="310" font-size="10.5" text-anchor="middle" fill="#4a4644">filter by time range</text>
  <text x="410" y="332" font-size="10.5" text-anchor="middle" fill="#4a4644">export CSV or JSON</text>
  <text x="410" y="354" font-size="10.5" text-anchor="middle" fill="#4a4644">90-day retention</text>

  <rect x="544" y="232" width="236" height="140" rx="6" fill="#fff3ee" stroke="#c84216" stroke-width="2"/>
  <text x="662" y="260" font-size="12.5" font-weight="700" text-anchor="middle" fill="#c84216">Autobot</text>
  <text x="662" y="288" font-size="10.5" text-anchor="middle" fill="#4a4644">AI copilot, in-account</text>
  <text x="662" y="310" font-size="10.5" text-anchor="middle" fill="#4a4644">writes scripts + workflows</text>
  <text x="662" y="332" font-size="10.5" text-anchor="middle" fill="#4a4644">runs and investigates</text>
  <text x="662" y="354" font-size="10.5" text-anchor="middle" fill="#4a4644">shared pool or your key</text>

  <text x="28" y="396" font-size="10" fill="#4a4644">One sign-in for all of it. Every query is scoped to your account — there is no unscoped path.</text>
</svg>
