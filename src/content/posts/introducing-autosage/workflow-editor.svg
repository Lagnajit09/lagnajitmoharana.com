<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" font-family="'JetBrains Mono', ui-monospace, monospace" role="img" aria-label="A workflow is a graph of trigger, action and decision nodes">
  <rect x="1" y="1" width="818" height="398" rx="10" fill="#ffffff" stroke="#141313" stroke-width="2"/>

  <text x="28" y="40" font-size="15" font-weight="700" fill="#141313">A workflow is a graph of three node types</text>
  <line x1="28" y1="52" x2="792" y2="52" stroke="#d6d0cc" stroke-width="1.5"/>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#141313"/>
    </marker>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#c84216"/>
    </marker>
  </defs>

  <!-- Trigger -->
  <circle cx="108" cy="160" r="50" fill="#fcf9f8" stroke="#141313" stroke-width="2"/>
  <text x="108" y="156" font-size="12" font-weight="700" text-anchor="middle" fill="#141313">Manual</text>
  <text x="108" y="174" font-size="12" font-weight="700" text-anchor="middle" fill="#141313">Trigger</text>

  <!-- Action 1 -->
  <rect x="200" y="128" width="160" height="64" rx="6" fill="#fcf9f8" stroke="#141313" stroke-width="2"/>
  <text x="280" y="155" font-size="12.5" font-weight="700" text-anchor="middle" fill="#141313">Run Script</text>
  <text x="280" y="175" font-size="10.5" text-anchor="middle" fill="#4a4644">on server A</text>

  <!-- Decision -->
  <polygon points="470,100 530,160 470,220 410,160" fill="#fff3ee" stroke="#c84216" stroke-width="2"/>
  <text x="470" y="156" font-size="11.5" font-weight="700" text-anchor="middle" fill="#c84216">Condition</text>
  <text x="470" y="172" font-size="11.5" font-weight="700" text-anchor="middle" fill="#c84216">Check</text>

  <!-- True branch -->
  <rect x="592" y="86" width="188" height="60" rx="6" fill="#fcf9f8" stroke="#141313" stroke-width="2"/>
  <text x="686" y="112" font-size="12.5" font-weight="700" text-anchor="middle" fill="#141313">Run Script</text>
  <text x="686" y="131" font-size="10.5" text-anchor="middle" fill="#4a4644">cleanup</text>

  <!-- False branch -->
  <rect x="592" y="196" width="188" height="60" rx="6" fill="#fcf9f8" stroke="#141313" stroke-width="2"/>
  <text x="686" y="222" font-size="12.5" font-weight="700" text-anchor="middle" fill="#141313">Send Email</text>
  <text x="686" y="241" font-size="10.5" text-anchor="middle" fill="#4a4644">notify me</text>

  <!-- Arrows -->
  <line x1="158" y1="160" x2="196" y2="160" stroke="#141313" stroke-width="2" marker-end="url(#a)"/>
  <line x1="360" y1="160" x2="406" y2="160" stroke="#141313" stroke-width="2" marker-end="url(#a)"/>
  <line x1="530" y1="148" x2="588" y2="120" stroke="#141313" stroke-width="2" marker-end="url(#a)"/>
  <text x="546" y="128" font-size="10" font-weight="700" fill="#141313">True</text>
  <line x1="530" y1="172" x2="588" y2="212" stroke="#c84216" stroke-width="2" marker-end="url(#ao)"/>
  <text x="542" y="205" font-size="10" font-weight="700" fill="#c84216">False</text>

  <!-- Legend band -->
  <rect x="40" y="288" width="740" height="66" rx="6" fill="#ede9e6" stroke="#141313" stroke-width="1.5"/>
  <text x="410" y="312" font-size="11" font-weight="700" text-anchor="middle" fill="#141313">Trigger: how a run starts — manual · HTTP webhook · cron schedule</text>
  <text x="410" y="334" font-size="11" text-anchor="middle" fill="#4a4644">Action: a script on one server, or an email  ·  Decision: forks on a true/false rule</text>

  <text x="28" y="382" font-size="10" fill="#4a4644">Independent branches run in parallel. The canvas refuses self-links and cycles, and the server checks again on save.</text>
</svg>
