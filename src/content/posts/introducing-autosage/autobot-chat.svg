<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="'JetBrains Mono', ui-monospace, monospace" role="img" aria-label="Autobot — three modes, enforced on the server">
  <rect x="1" y="1" width="858" height="398" rx="10" fill="#ffffff" stroke="#141313" stroke-width="2"/>

  <text x="28" y="40" font-size="15" font-weight="700" fill="#141313">Autobot — three modes, enforced on the server</text>
  <line x1="28" y1="52" x2="832" y2="52" stroke="#d6d0cc" stroke-width="1.5"/>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#141313"/>
    </marker>
  </defs>

  <rect x="37" y="80" width="246" height="160" rx="6" fill="#fcf9f8" stroke="#141313" stroke-width="2"/>
  <text x="160" y="108" font-size="13" font-weight="700" text-anchor="middle" fill="#141313">RESEARCH</text>
  <text x="160" y="128" font-size="10" text-anchor="middle" fill="#4a4644">read-only</text>
  <text x="160" y="158" font-size="10.5" text-anchor="middle" fill="#4a4644">list and read your scripts</text>
  <text x="160" y="182" font-size="10.5" text-anchor="middle" fill="#4a4644">read your workflows</text>
  <text x="160" y="206" font-size="10.5" text-anchor="middle" fill="#4a4644">read run history + logs</text>

  <rect x="307" y="80" width="246" height="160" rx="6" fill="#fcf9f8" stroke="#141313" stroke-width="2"/>
  <text x="430" y="108" font-size="13" font-weight="700" text-anchor="middle" fill="#141313">GENERATION</text>
  <text x="430" y="128" font-size="10" text-anchor="middle" fill="#4a4644">read + write</text>
  <text x="430" y="158" font-size="10.5" text-anchor="middle" fill="#4a4644">create and edit scripts</text>
  <text x="430" y="182" font-size="10.5" text-anchor="middle" fill="#4a4644">build whole workflows</text>
  <text x="430" y="206" font-size="10.5" text-anchor="middle" fill="#4a4644">still cannot run anything</text>

  <rect x="577" y="80" width="246" height="160" rx="6" fill="#fff3ee" stroke="#c84216" stroke-width="2"/>
  <text x="700" y="108" font-size="13" font-weight="700" text-anchor="middle" fill="#c84216">EXECUTION</text>
  <text x="700" y="128" font-size="10" text-anchor="middle" fill="#4a4644">read + write + run</text>
  <text x="700" y="158" font-size="10.5" text-anchor="middle" fill="#4a4644">run · re-run · investigate</text>
  <text x="700" y="182" font-size="10.5" text-anchor="middle" fill="#4a4644">needs your own LLM key</text>
  <text x="700" y="206" font-size="10.5" text-anchor="middle" fill="#4a4644">capped by a daily quota</text>

  <line x1="283" y1="160" x2="303" y2="160" stroke="#141313" stroke-width="2" marker-end="url(#a)"/>
  <line x1="553" y1="160" x2="573" y2="160" stroke="#141313" stroke-width="2" marker-end="url(#a)"/>

  <rect x="37" y="268" width="786" height="76" rx="6" fill="#ede9e6" stroke="#141313" stroke-width="1.5"/>
  <text x="430" y="292" font-size="11" font-weight="700" text-anchor="middle" fill="#141313">Guardrails</text>
  <text x="430" y="313" font-size="10.5" text-anchor="middle" fill="#4a4644">A tool is never offered to the model in a lower mode — and is refused again at dispatch.</text>
  <text x="430" y="333" font-size="10.5" text-anchor="middle" fill="#4a4644">A password value never reaches the model; runtime secrets go browser → server, direct.</text>

  <text x="28" y="378" font-size="10" fill="#4a4644">Autobot acts as you. It cannot reach anything you could not reach yourself, and it cannot escalate.</text>
</svg>
