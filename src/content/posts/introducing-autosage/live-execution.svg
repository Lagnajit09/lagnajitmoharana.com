<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" font-family="'JetBrains Mono', ui-monospace, monospace" role="img" aria-label="How a log line reaches your browser">
  <rect x="1" y="1" width="998" height="298" rx="10" fill="#ffffff" stroke="#141313" stroke-width="2"/>

  <text x="28" y="40" font-size="15" font-weight="700" fill="#141313">How a log line reaches your browser</text>
  <line x1="28" y1="52" x2="972" y2="52" stroke="#d6d0cc" stroke-width="1.5"/>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#141313"/>
    </marker>
  </defs>

  <rect x="25" y="92" width="140" height="92" rx="6" fill="#fcf9f8" stroke="#141313" stroke-width="2"/>
  <text x="95" y="120" font-size="11.5" font-weight="700" text-anchor="middle" fill="#141313">Your server</text>
  <text x="95" y="145" font-size="10" text-anchor="middle" fill="#4a4644">stdout / stderr</text>
  <text x="95" y="164" font-size="10" text-anchor="middle" fill="#4a4644">as it runs</text>

  <rect x="187" y="92" width="140" height="92" rx="6" fill="#fff3ee" stroke="#c84216" stroke-width="2"/>
  <text x="257" y="120" font-size="11.5" font-weight="700" text-anchor="middle" fill="#c84216">exec-worker</text>
  <text x="257" y="145" font-size="10" text-anchor="middle" fill="#4a4644">NDJSON chunks</text>
  <text x="257" y="164" font-size="10" text-anchor="middle" fill="#4a4644">streamed out</text>

  <rect x="349" y="92" width="140" height="92" rx="6" fill="#fcf9f8" stroke="#141313" stroke-width="2"/>
  <text x="419" y="120" font-size="11.5" font-weight="700" text-anchor="middle" fill="#141313">Celery worker</text>
  <text x="419" y="145" font-size="10" text-anchor="middle" fill="#4a4644">masks passwords</text>
  <text x="419" y="164" font-size="10" text-anchor="middle" fill="#4a4644">buffers for GCS</text>

  <rect x="511" y="92" width="140" height="92" rx="6" fill="#fcf9f8" stroke="#141313" stroke-width="2"/>
  <text x="581" y="120" font-size="11.5" font-weight="700" text-anchor="middle" fill="#141313">Redis Pub/Sub</text>
  <text x="581" y="145" font-size="10" text-anchor="middle" fill="#4a4644">one channel</text>
  <text x="581" y="164" font-size="10" text-anchor="middle" fill="#4a4644">per run</text>

  <rect x="673" y="92" width="140" height="92" rx="6" fill="#fcf9f8" stroke="#141313" stroke-width="2"/>
  <text x="743" y="120" font-size="11.5" font-weight="700" text-anchor="middle" fill="#141313">Django</text>
  <text x="743" y="145" font-size="10" text-anchor="middle" fill="#4a4644">async view</text>
  <text x="743" y="164" font-size="10" text-anchor="middle" fill="#4a4644">SSE frames</text>

  <rect x="835" y="92" width="140" height="92" rx="6" fill="#fcf9f8" stroke="#141313" stroke-width="2"/>
  <text x="905" y="120" font-size="11.5" font-weight="700" text-anchor="middle" fill="#141313">Browser</text>
  <text x="905" y="145" font-size="10" text-anchor="middle" fill="#4a4644">live terminal</text>
  <text x="905" y="164" font-size="10" text-anchor="middle" fill="#4a4644">nodes light up</text>

  <line x1="165" y1="138" x2="183" y2="138" stroke="#141313" stroke-width="2" marker-end="url(#a)"/>
  <line x1="327" y1="138" x2="345" y2="138" stroke="#141313" stroke-width="2" marker-end="url(#a)"/>
  <line x1="489" y1="138" x2="507" y2="138" stroke="#141313" stroke-width="2" marker-end="url(#a)"/>
  <line x1="651" y1="138" x2="669" y2="138" stroke="#141313" stroke-width="2" marker-end="url(#a)"/>
  <line x1="813" y1="138" x2="831" y2="138" stroke="#141313" stroke-width="2" marker-end="url(#a)"/>

  <rect x="25" y="212" width="950" height="60" rx="6" fill="#ede9e6" stroke="#141313" stroke-width="1.5"/>
  <text x="500" y="236" font-size="11" font-weight="700" text-anchor="middle" fill="#141313">Why the extra hop?</text>
  <text x="500" y="258" font-size="10.5" text-anchor="middle" fill="#4a4644">The worker and the web process are different containers, and browsers reconnect. The channel decouples them.</text>
</svg>
