<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Favicon ──────────────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- ── App / theme meta (global, not per-route) ──────────────────────── -->
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="color-scheme" content="dark light" />

    <!-- ── Per-route: title, description, OG, Twitter, JSON-LD ────────────
         Injected here by Vite SSR pre-render (prerender.mjs).
         Falls back to react-helmet-async on the client for SPA navigation.
    ─────────────────────────────────────────────────────────────────────── -->
    <!--ssr-head-->

    <!-- ── No-flash theme init ──────────────────────────────────────────── -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersLight = window.matchMedia(
            "(prefers-color-scheme: light)",
          ).matches;
          var theme = stored || (prefersLight ? "light" : "dark");
          if (theme === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--ssr-body--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
